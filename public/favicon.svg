<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Premium Golden Gradients -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="sapphire-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle (Sleek Dark Navy) -->
  <rect width="128" height="128" rx="32" fill="#0b1120" stroke="#1e293b" stroke-width="4" />

  <!-- Logo Graphics -->
  <g transform="translate(16, 16)">
    <!-- High-rise Building Structure Lines (Monogram B & J Silhouette) -->
    <!-- Column 1 (Left building / Back of B) -->
    <rect x="24" y="28" width="16" height="52" rx="4" fill="url(#sapphire-gradient)" opacity="0.8" />
    
    <!-- Building tiers forming 'B' curve loops -->
    <path d="M40 28H64C72.8366 28 80 35.1634 80 44C80 52.8366 72.8366 60 64 60H40V28Z" fill="url(#gold-gradient)" filter="url(#glow)" />
    <path d="M40 54H68C76.8366 54 84 61.1634 84 70C84 78.8366 76.8366 86 68 86H32C27.5817 86 24 82.4183 24 78V60H40V54Z" fill="url(#gold-gradient)" opacity="0.9" />

    <!-- Swooshing Graduation Cap Outline / J-Curve (Sweeping beneath) -->
    <path d="M12 40L48 24L84 40L48 56L12 40Z" fill="#1e293b" stroke="url(#gold-gradient)" stroke-width="3" stroke-linejoin="round" />
    <path d="M48 56V76C48 84.8366 40.8366 92 32 92C23.1634 92 16 84.8366 16 76" stroke="url(#gold-gradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Tassel hanging from cap -->
    <path d="M84 40V58C84 62 80 64 80 64" stroke="url(#gold-gradient)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="80" cy="65" r="3" fill="url(#gold-gradient)" />
  </g>
</svg>