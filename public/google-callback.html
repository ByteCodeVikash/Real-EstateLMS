<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authenticating with Google...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #070b14;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: #3b82f6;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h3 {
      font-weight: 600;
      margin: 0;
      font-size: 16px;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h3>Securing connection...</h3>

  <script>
    // Extract tokens from hash or search parameters
    const getParam = (name) => {
      const hash = window.location.hash.substring(1);
      const search = window.location.search.substring(1);
      
      const searchParams = new URLSearchParams(hash || search);
      return searchParams.get(name);
    };

    const idToken = getParam('id_token') || getParam('credential');
    const error = getParam('error');

    if (idToken) {
      // Send token back to the parent React application
      window.opener.postMessage(
        { type: 'GOOGLE_AUTH_SUCCESS', idToken: idToken }, 
        window.location.origin
      );
      window.close();
    } else if (error) {
      // Send error back to the parent React application
      window.opener.postMessage(
        { type: 'GOOGLE_AUTH_FAILURE', message: error }, 
        window.location.origin
      );
      window.close();
    } else {
      // Fallback: If page loaded without parameters (e.g. direct access)
      document.querySelector('h3').innerText = "Direct access not allowed. Closing...";
      setTimeout(() => {
        window.close();
      }, 2000);
    }
  </script>
</body>
</html>
